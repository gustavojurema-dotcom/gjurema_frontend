[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gjurema-mvp"
version = "0.1.0"
description = "MVP do modelo de precificação e análise de investimento imobiliário da GJurema"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "requests>=2.31",
    "openpyxl>=3.1",
    "pyarrow>=14",
    "scikit-learn>=1.3",
    "xgboost>=2.0",
    "streamlit>=1.30",
    "plotly>=5.18",
    "fastapi>=0.110",
    "uvicorn>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.4", "httpx>=0.27"]

[project.scripts]
gjurema-pipeline = "gjurema.pipeline:main"
gjurema-pipeline-sp = "gjurema.pipeline_sp:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gjurema = ["api/static/*.html"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
